name: Skill validation
on: [push, pull_request]
jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: python -m pip install -r requirements-mcp.txt
      - run: npm ci --prefix forge-app --ignore-scripts --no-audit --no-fund
      - run: python scripts/validate_skill.py
      - run: python scripts/validate_evaluation_corpus.py
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python -m investigation_harness.evaluate --split all
      - run: node --test forge-app/src/trace.test.mjs forge-app/src/response.test.mjs
      - run: python scripts/package_plugin.py
